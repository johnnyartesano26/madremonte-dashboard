name: Actualizar Bar (arqueo)

on:
  schedule:
    - cron: '0 19 * * 1'    # Lunes 14:00 hora Colombia (UTC-5)
  workflow_dispatch:         # botón "Run workflow" para actualizar cuando quieras

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests openpyxl

      - name: Regenerar bar.html desde Google Sheets
        run: python3 update_bar_dashboard.py

      - name: Publicar cambios (si hay)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bar.html
          if git diff --cached --quiet; then
            echo "Sin cambios en bar.html."
          else
            git commit -m "Auto-actualización Bar: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
